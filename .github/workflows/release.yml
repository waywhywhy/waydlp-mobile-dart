name: Release

# Builds signed APKs/AAB after CI and emulator tests and publishes a release with
# checksums. Requires repository secrets (see docs/SIGNING.md):
#   WAYDLP_KEYSTORE_BASE64, WAYDLP_KEYSTORE_PASSWORD, WAYDLP_KEY_ALIAS, WAYDLP_KEY_PASSWORD

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check version matches tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          P=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [ "$V" = "$P" ] || { echo "::error::tag $V != pubspec $P"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.WAYDLP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Release signing secrets are missing; refusing to publish a debug-signed release."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WAYDLP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get && flutter test
      - name: Build
        env:
          WAYDLP_KEYSTORE_PASSWORD: ${{ secrets.WAYDLP_KEYSTORE_PASSWORD }}
          WAYDLP_KEY_ALIAS: ${{ secrets.WAYDLP_KEY_ALIAS }}
          WAYDLP_KEY_PASSWORD: ${{ secrets.WAYDLP_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release
      - name: Rename artifacts and checksum
        run: |
          mkdir out
          O=build/app/outputs
          cp $O/flutter-apk/app-arm64-v8a-release.apk out/waydlp-$VERSION-android-arm64.apk
          cp $O/flutter-apk/app-armeabi-v7a-release.apk out/waydlp-$VERSION-android-armv7.apk
          cp $O/flutter-apk/app-x86_64-release.apk out/waydlp-$VERSION-android-x64.apk
          cp $O/flutter-apk/app-release.apk out/waydlp-$VERSION-android-universal.apk
          cp $O/bundle/release/app-release.aab out/waydlp-$VERSION-android-universal.aab
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Verify signatures
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in out/*.apk; do "$BT/apksigner" verify --print-certs "$f" | head -3; done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" out/* --verify-tag --title "waydlp for Android $VERSION" --generate-notes
